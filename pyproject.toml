[project]
name = "ws50-climate-influxdb"
version = "0.1.0"
description = "Import Withings WS-50 temperature and CO2 history into InfluxDB v1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ws50-climate-influxdb = "ws50_climate.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws50_climate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
